# Unit tests, plus a live round trip through the real cache: one job saves a
# session, the next job restores it and must get --resume for it.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test

  save-session:
    runs-on: ubuntu-latest
    outputs:
      session-id: ${{ steps.save.outputs.session-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore (nothing cached yet)
        id: restore
        uses: ./restore
        with:
          scope: selftest-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert fresh start
        env:
          RESUMED: ${{ steps.restore.outputs.resumed }}
        run: test "$RESUMED" = "false"
      - name: Fake a Claude transcript
        run: |
          dir="$HOME/.claude/projects/-home-runner-work-selftest"
          mkdir -p "$dir"
          echo '{"type":"user","message":{"content":"hi"}}' > "$dir/11111111-1111-4111-8111-111111111111.jsonl"
      - name: Save
        id: save
        if: always()
        uses: ./save
      - name: Assert saved
        env:
          SESSION_ID: ${{ steps.save.outputs.session-id }}
        run: test "$SESSION_ID" = "11111111-1111-4111-8111-111111111111"

  resume-session:
    needs: save-session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore
        id: restore
        uses: ./restore
        with:
          scope: selftest-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert resumed
        env:
          RESUMED: ${{ steps.restore.outputs.resumed }}
          RESUME_ARGS: ${{ steps.restore.outputs.resume-args }}
        run: |
          test "$RESUMED" = "true"
          test "$RESUME_ARGS" = "--resume 11111111-1111-4111-8111-111111111111"
